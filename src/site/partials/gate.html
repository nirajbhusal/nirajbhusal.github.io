<div id="enter-gate" class="enter-gate" role="dialog" aria-modal="true" aria-labelledby="enter-gate-title" aria-describedby="enter-gate-focus">
    <canvas id="enter-gate-canvas" class="enter-gate-canvas" aria-hidden="true"></canvas>
    <div class="enter-gate-veil" aria-hidden="true"></div>
    <div class="enter-gate-inner">
      <div class="enter-gate-sheet">
        <span class="enter-gate-mark enter-gate-mark-tl" aria-hidden="true"></span>
        <span class="enter-gate-mark enter-gate-mark-tr" aria-hidden="true"></span>
        <span class="enter-gate-mark enter-gate-mark-bl" aria-hidden="true"></span>
        <span class="enter-gate-mark enter-gate-mark-br" aria-hidden="true"></span>
        <p class="sheet-label enter-gate-kicker">◇ PORTFOLIO</p>
        <h1 id="enter-gate-title" class="enter-gate-name"><span class="hero-given">Niraj</span><span class="hero-family">Bhusal</span></h1>
        <p class="enter-gate-line" id="enter-gate-focus"><span class="enter-gate-area">GovTech</span><span class="enter-gate-dot"> • </span><span class="enter-gate-area">AI Governance</span><span class="enter-gate-dot"> • </span><span class="enter-gate-area">Digital Public Infrastructure</span></p>
        <div class="enter-gate-chrono" aria-label="Local time and year progress">
          <p class="hero-caption">move with time, understand the universe</p>
          <p class="hero-clock" aria-live="polite">
            <time data-chrono="datetime" datetime=""></time>
          </p>
          <div class="progress-stack">
            <div class="year-progress" role="progressbar" aria-labelledby="gate-year-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-chrono="year-bar">
              <div class="progress-track year-track">
                <div class="progress-fill year-fill" data-chrono="year-fill"></div>
              </div>
              <div class="progress-meta">
                <span id="gate-year-label" data-chrono="year-label">Day 1 · 0% of 2026</span>
                <span class="progress-pct" data-chrono="year-pct">0%</span>
              </div>
            </div>
            <div class="day-progress" role="progressbar" aria-labelledby="gate-day-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-chrono="day-bar">
              <div class="progress-track day-track">
                <div class="progress-fill day-fill" data-chrono="day-fill"></div>
              </div>
              <div class="progress-meta day-meta">
                <span id="gate-day-label" data-chrono="day-label">Today</span>
                <span class="progress-pct" data-chrono="day-pct">0%</span>
              </div>
            </div>
          </div>
        </div>
        <button type="button" id="enter-gate-btn" class="btn btn-gate">Enter</button>
      </div>
    </div>
  </div>
