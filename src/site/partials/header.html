  <header class="site-header" data-gate-inert inert>
    <div class="site-header-glass" aria-hidden="true"></div>
    <a class="logo" href="/">NB</a>
    <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-label" aria-hidden="true">Menu</span>
    </button>
    <div class="header-actions">
      <div class="sound-control" role="group" aria-label="Ambient sound volume">
        <button type="button" id="sound-vol-down" class="sound-vol-btn" aria-label="Decrease volume" title="Volume down">−</button>
        <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="false" aria-label="Sound off" title="Ambient sound" data-vol-level="0">
          <span class="sound-icon" aria-hidden="true">
            <svg class="sound-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 10v4h3l4 3V7L7 10H4z"/>
              <path class="sound-wave sound-wave-1" d="M14.5 9.5a3.5 3.5 0 0 1 0 5"/>
              <path class="sound-wave sound-wave-2" d="M16.8 7.5a6.5 6.5 0 0 1 0 9"/>
              <line class="sound-mute-slash" x1="4" y1="4" x2="20" y2="20"/>
            </svg>
          </span>
          <span class="sound-label" id="sound-level-label">Vol</span>
        </button>
        <button type="button" id="sound-vol-up" class="sound-vol-btn" aria-label="Increase volume" title="Volume up">+</button>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light mode" title="Toggle theme">
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>
