<section id="play" class="section reveal">
      <p class="sheet-label">◇ SHEET 10 · GAMES</p>
      <h2>Games</h2>
      <p class="section-lede play-lede">One quiet game. Play opens the same basketball popup. Esc closes.</p>
      <div class="play-grid games-category-grid">
        <article class="card game-launch-card">
          <div class="game-launch-icon" aria-hidden="true">◉</div>
          <h3>Basketball</h3>
          <p class="meta">Aim · charge · shoot · one popup</p>
          <div class="game-controls">
            <button type="button" class="btn btn-primary" data-open-game="basketball">Play</button>
          </div>
        </article>
        <div class="card constellation-card">
          <h3>Constellation</h3>
          <p class="meta">Click a star for a fact</p>
          <canvas id="constellation" width="480" height="400" role="img" aria-label="Clickable constellation of facts"></canvas>
          <p id="fact-panel" class="fact-panel" aria-live="polite">Select a star.</p>
        </div>
      </div>
    </section>
